# agent-pmo:795a9c2
# Deslop duplication gate — REPO-STANDARDS-SPEC [CI-DESLOP]
# Single source of truth for this repo's duplication budget.
# Docs: https://deslop.live/docs/for-ai/
[defaults]
# Generated ANTLR outputs cannot be deduplicated by hand. Excluding them before
# analysis also avoids comparing millions of generated parser subtrees.
exclude = [
  # Reporting is outside the requested duplication audit scope.
  "Reporting/**",
  # Independent scenario datasets contain schema/configuration input, never runners
  # or assertions. Keep each scenario explicit to protect its test oracle.
  "**/Fixtures/*.Fixtures.cs",
  # Fixed public model contracts contain declarations and data initialization only.
  # Their distinct exported types must retain their API and cannot share one type.
  "Migration/Nimblesite.DataProvider.Migration.Core/SchemaOperation.cs",
  "Lql/Nimblesite.Lql.Core/SelectDistinctStep.cs",
  "Lql/Nimblesite.Lql.Core/GroupByStep.cs",
  "Lql/Nimblesite.Lql.Core/SelectStep.cs",
  "Other/Nimblesite.Sql.Model/SubQueryColumn.cs",
  "Other/Nimblesite.Sql.Model/ExpressionColumn.cs",
  # Standalone teaching projects intentionally show complete, independent usage.
  "DataProvider/Nimblesite.DataProvider.Example/**",
  "DataProvider/Nimblesite.DataProvider.Example.FSharp/**",
  "DataProvider/Nimblesite.DataProvider.SQLite.FSharp/**",
  "DataProvider/Nimblesite.DataProvider.Postgres/Parsing/PostgreSQLLexer.cs",
  "DataProvider/Nimblesite.DataProvider.Postgres/Parsing/PostgreSQLParser.cs",
  "DataProvider/Nimblesite.DataProvider.Postgres/Parsing/PostgreSQLParserBaseListener.cs",
  "DataProvider/Nimblesite.DataProvider.Postgres/Parsing/PostgreSQLParserBaseVisitor.cs",
  "DataProvider/Nimblesite.DataProvider.Postgres/Parsing/PostgreSQLParserListener.cs",
  "DataProvider/Nimblesite.DataProvider.Postgres/Parsing/PostgreSQLParserVisitor.cs",
  "DataProvider/Nimblesite.DataProvider.SQLite/Parsing/SQLiteLexer.cs",
  "DataProvider/Nimblesite.DataProvider.SQLite/Parsing/SQLiteParser.cs",
  "DataProvider/Nimblesite.DataProvider.SQLite/Parsing/SQLiteParserBaseListener.cs",
  "DataProvider/Nimblesite.DataProvider.SQLite/Parsing/SQLiteParserBaseVisitor.cs",
  "DataProvider/Nimblesite.DataProvider.SQLite/Parsing/SQLiteParserListener.cs",
  "DataProvider/Nimblesite.DataProvider.SQLite/Parsing/SQLiteParserVisitor.cs",
  "Lql/Nimblesite.Lql.Core/Parsing/LqlBaseListener.cs",
  "Lql/Nimblesite.Lql.Core/Parsing/LqlBaseVisitor.cs",
  "Lql/Nimblesite.Lql.Core/Parsing/LqlLexer.cs",
  "Lql/Nimblesite.Lql.Core/Parsing/LqlListener.cs",
  "Lql/Nimblesite.Lql.Core/Parsing/LqlParser.cs",
  "Lql/Nimblesite.Lql.Core/Parsing/LqlVisitor.cs",
  "Lql/lql-lsp-rust/crates/lql-parser/src/generated/**",
]

[threshold]
# Target duplication ceiling. Keep findings visible while refactoring toward it.
# Subsequent changes may only ratchet this DOWN.
max_duplication_percent = 10.0
