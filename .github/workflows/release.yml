# agent-pmo:795a9c2
# Tag-triggered release. Stamps the tag version into the runner working tree only
# (NO commit/push/tag bump after the tag exists — [SWR-VERSION-BUILD-STAMPING]),
# runs the CI + CodeQL hard gate, then publishes NuGet packages, per-platform binaries
# (GitHub Release), Homebrew + Scoop, and deploys
# both documentation sites. [SWR-REL-WORKFLOW] [SWR-REL-GITHUB]
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to preflight without publishing (for example 0.10.0-beta)
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Least privilege by default; write/id-token are granted per job. [SWR-SEC-TOKEN-PRIVILEGE]
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Implements [CI-TIMEOUT]: apply compiler limits to release packing too.
  DOTNET_PROCESSOR_COUNT: 2
  DOTNET_GCHeapHardLimit: '0x80000000'
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1
  OWNER_REPO: Nimblesite/DataProvider

jobs:
  # ── Stamp + gate ──────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Derive release version
        id: v
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stamp version into runner working tree (never committed)
        shell: bash
        run: python3 tools/shipwright-version-stamp.py --tag "v${{ steps.v.outputs.version }}" --root .
      - name: Validate Shipwright manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate-manifest.py shipwright.json
          python3 tools/validate-manifest.py Lql/LqlExtension/shipwright.json
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
      # Marketplace publishing is disabled at the user's request. [SWR-VSIX-PUBLISH-AUTH]
      # - name: Verify Marketplace publishing credentials
      #   uses: ./.github/actions/marketplace-auth
      #   with:
      #     azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      #     marketplace_pat: ${{ secrets.VSCODE_MARKETPLACE_PAT }}

  # Implements [CI-RELEASE-GATE]: run the same CI on the tagged SHA before publishing.
  ci-gate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ── CodeQL hard release gate (blocks every publish job) ───────────────────
  codeql-gate:
    needs: prepare
    uses: ./.github/workflows/codeql.yml
    with:
      gate: true
    permissions:
      security-events: write
      actions: read
      contents: read

  # ── NuGet trusted-publishing preflight [CI-RELEASE-NUGET-OIDC] ─────────────
  # Proves the nuget.org trusted-publishing policy accepts this workflow BEFORE any
  # job publishes, so a missing or mismatched policy stops the release (and the
  # manual preflight) instead of leaving binaries released without packages.
  nuget-oidc-preflight:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The policy is scoped to Environment=release; the OIDC token carries that
    # claim only when the job is bound to the environment.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org organization that owns the packages and the policy.
          user: Nimblesite

  # ── NuGet packages ────────────────────────────────────────────────────────
  # KEYLESS: exchanges a short-lived GitHub OIDC token for a ~1h nuget.org API key.
  # No long-lived NuGet API key is stored. Implements [CI-RELEASE-NUGET-OIDC].
  publish-nuget:
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.prepare.result == 'success' && needs.ci-gate.result == 'success' &&
      needs.codeql-gate.result == 'success' && needs.nuget-oidc-preflight.result == 'success'
    needs: [prepare, ci-gate, codeql-gate, nuget-oidc-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v5.0.0
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Stamp version from tag
        shell: bash
        run: python3 tools/shipwright-version-stamp.py --tag "v${{ needs.prepare.outputs.version }}" --root .
      - name: Pack solution
        shell: bash
        run: dotnet pack DataProvider.sln -c Release -o ./nupkgs
      # Minted after packing, immediately before the push, so it cannot expire in transit.
      - name: NuGet login (OIDC trusted publishing)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Nimblesite
      - name: Push packages to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(./nupkgs/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No packages produced — failing." >&2
            exit 1
          fi
          for pkg in "${packages[@]}"; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  # ── Per-platform binaries → GitHub Release ────────────────────────────────
  release-binaries:
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.prepare.result == 'success' && needs.ci-gate.result == 'success' &&
      needs.codeql-gate.result == 'success' && needs.nuget-oidc-preflight.result == 'success'
    needs: [prepare, ci-gate, codeql-gate, nuget-oidc-preflight]
    uses: ./.github/workflows/release-binary-multiplatform.yml
    with:
      binary_name: lql-lsp
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  # ── Per-platform .NET Native AOT migration CLI → GitHub Release [MIG-AOT-CI] ─
  release-dotnet-binaries:
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.prepare.result == 'success' && needs.ci-gate.result == 'success' &&
      needs.codeql-gate.result == 'success' && needs.nuget-oidc-preflight.result == 'success'
    needs: [prepare, ci-gate, codeql-gate, nuget-oidc-preflight]
    uses: ./.github/workflows/release-dotnet-aot-multiplatform.yml
    with:
      binary_name: DataProviderMigrate
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write

  # ── Extract per-asset checksums from the signed SHA256SUMS ─────────────────
  checksums:
    needs: [prepare, release-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      darwin_arm64: ${{ steps.x.outputs.darwin_arm64 }}
      win32_x64: ${{ steps.x.outputs.win32_x64 }}
    steps:
      - name: Fetch and parse SHA256SUMS from the release
        id: x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --repo "${OWNER_REPO}" --pattern SHA256SUMS --dir .
          darwin="$(grep -E "lql-lsp-${VERSION}-darwin-arm64\.tar\.gz$" SHA256SUMS | awk '{print $1}')"
          win="$(grep -E "lql-lsp-${VERSION}-win32-x64\.zip$" SHA256SUMS | awk '{print $1}')"
          test -n "$darwin" && test -n "$win"
          echo "darwin_arm64=${darwin}" >> "$GITHUB_OUTPUT"
          echo "win32_x64=${win}" >> "$GITHUB_OUTPUT"

  # ── Homebrew tap ──────────────────────────────────────────────────────────
  # Implements [CI-RELEASE-BREW-SCOOP]. GitHub has no OIDC path for pushing to another
  # repository, so the tap and bucket use the Nimblesite org secret BREW_SCOOP_PAT,
  # shared with every Nimblesite repository that publishes to them.
  publish-brew:
    needs: [prepare, checksums]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.checksums.result == 'success' && needs.prepare.outputs.prerelease == 'false'
    uses: ./.github/workflows/publish-brew-tap.yml
    with:
      tap_repo: Nimblesite/homebrew-tap
      formula_name: lql-lsp
      version: ${{ needs.prepare.outputs.version }}
      asset_url: https://github.com/Nimblesite/DataProvider/releases/download/v${{ needs.prepare.outputs.version }}/lql-lsp-${{ needs.prepare.outputs.version }}-darwin-arm64.tar.gz
      sha256: ${{ needs.checksums.outputs.darwin_arm64 }}
      binary_name: lql-lsp
      homepage: https://github.com/Nimblesite/DataProvider
      description: Lambda Query Language LSP server
    secrets:
      tap_token: ${{ secrets.BREW_SCOOP_PAT }}

  # ── Scoop bucket ──────────────────────────────────────────────────────────
  publish-scoop:
    needs: [prepare, checksums]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.checksums.result == 'success' && needs.prepare.outputs.prerelease == 'false'
    uses: ./.github/workflows/publish-scoop-bucket.yml
    with:
      bucket_repo: Nimblesite/scoop-bucket
      manifest_name: lql-lsp
      version: ${{ needs.prepare.outputs.version }}
      url: https://github.com/Nimblesite/DataProvider/releases/download/v${{ needs.prepare.outputs.version }}/lql-lsp-${{ needs.prepare.outputs.version }}-win32-x64.zip
      sha256: ${{ needs.checksums.outputs.win32_x64 }}
      bin: lql-lsp.exe
      homepage: https://github.com/Nimblesite/DataProvider
      description: Lambda Query Language LSP server
    secrets:
      bucket_token: ${{ secrets.BREW_SCOOP_PAT }}

  # ── Migration CLI checksums (from its own signed SHA256SUMS) [MIG-AOT-CI] ──
  dotnet-checksums:
    needs: [prepare, release-dotnet-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      darwin_arm64: ${{ steps.x.outputs.darwin_arm64 }}
      win32_x64: ${{ steps.x.outputs.win32_x64 }}
    steps:
      - name: Fetch and parse DataProviderMigrate-SHA256SUMS from the release
        id: x
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "v${VERSION}" --repo "${OWNER_REPO}" --pattern DataProviderMigrate-SHA256SUMS --dir .
          darwin="$(grep -E "DataProviderMigrate-${VERSION}-darwin-arm64\.tar\.gz$" DataProviderMigrate-SHA256SUMS | awk '{print $1}')"
          win="$(grep -E "DataProviderMigrate-${VERSION}-win32-x64\.zip$" DataProviderMigrate-SHA256SUMS | awk '{print $1}')"
          test -n "$darwin" && test -n "$win"
          echo "darwin_arm64=${darwin}" >> "$GITHUB_OUTPUT"
          echo "win32_x64=${win}" >> "$GITHUB_OUTPUT"

  # ── Homebrew tap (migration CLI) ──────────────────────────────────────────
  publish-brew-migrate:
    needs: [prepare, dotnet-checksums]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.dotnet-checksums.result == 'success' && needs.prepare.outputs.prerelease == 'false'
    uses: ./.github/workflows/publish-brew-tap.yml
    with:
      tap_repo: Nimblesite/homebrew-tap
      formula_name: dataprovider-migrate
      version: ${{ needs.prepare.outputs.version }}
      asset_url: https://github.com/Nimblesite/DataProvider/releases/download/v${{ needs.prepare.outputs.version }}/DataProviderMigrate-${{ needs.prepare.outputs.version }}-darwin-arm64.tar.gz
      sha256: ${{ needs.dotnet-checksums.outputs.darwin_arm64 }}
      binary_name: DataProviderMigrate
      homepage: https://github.com/Nimblesite/DataProvider
      description: DataProvider database schema migration CLI (YAML → SQLite/PostgreSQL)
    secrets:
      tap_token: ${{ secrets.BREW_SCOOP_PAT }}

  # ── Scoop bucket (migration CLI) ──────────────────────────────────────────
  publish-scoop-migrate:
    needs: [prepare, dotnet-checksums]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.dotnet-checksums.result == 'success' && needs.prepare.outputs.prerelease == 'false'
    uses: ./.github/workflows/publish-scoop-bucket.yml
    with:
      bucket_repo: Nimblesite/scoop-bucket
      manifest_name: dataprovider-migrate
      version: ${{ needs.prepare.outputs.version }}
      url: https://github.com/Nimblesite/DataProvider/releases/download/v${{ needs.prepare.outputs.version }}/DataProviderMigrate-${{ needs.prepare.outputs.version }}-win32-x64.zip
      sha256: ${{ needs.dotnet-checksums.outputs.win32_x64 }}
      bin: DataProviderMigrate.exe
      homepage: https://github.com/Nimblesite/DataProvider
      description: DataProvider database schema migration CLI (YAML → SQLite/PostgreSQL)
    secrets:
      bucket_token: ${{ secrets.BREW_SCOOP_PAT }}

  # ── Per-platform VSIX → VS Code Marketplace ───────────────────────────────
  # Disabled at the user's request. [SWR-VSIX-PUBLISH-AUTH]
  # publish-vsix:
  #   if: >-
  #     github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
  #     needs.prepare.result == 'success' && needs.ci-gate.result == 'success' &&
  #     needs.codeql-gate.result == 'success' && needs.release-binaries.result == 'success'
  #   needs: [prepare, ci-gate, codeql-gate, release-binaries]
  #   uses: ./.github/workflows/publish-vsix-per-platform.yml
  #   with:
  #     version: ${{ needs.prepare.outputs.version }}
  #     pre_release: ${{ needs.prepare.outputs.prerelease == 'true' }}
  #     marketplace_environment: release
  #   secrets:
  #     azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
  #     azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  #     marketplace_pat: ${{ secrets.VSCODE_MARKETPLACE_PAT }}
  #   permissions:
  #     contents: read
  #     id-token: write
  #     attestations: write

  # ── Documentation sites (both deploy on release) ──────────────────────────
  deploy-lql-website:
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.publish-nuget.result == 'success'
    needs: [prepare, publish-nuget]
    uses: ./.github/workflows/deploy-lql-website.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      pages: write
      id-token: write

  deploy-website:
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      needs.publish-nuget.result == 'success' && needs.deploy-lql-website.result == 'success'
    needs: [prepare, publish-nuget, deploy-lql-website]
    uses: ./.github/workflows/deploy-pages.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
